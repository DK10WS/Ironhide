apiVersion: apps/v1
kind: Deployment
metadata:
  name: ironhide-frontend
  labels:
    app.kubernetes.io/name: ironhide
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ironhide
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ironhide
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: ironhide-frontend
          image: ghcr.io/dk10ws/ironhide-frontend:dev
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
