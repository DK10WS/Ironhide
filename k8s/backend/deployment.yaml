apiVersion: apps/v1
kind: Deployment
metadata:
  name: ironhide-backend
  labels:
    app.kubernetes.io/name: ironhide
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ironhide
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ironhide
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: ironhide-backend
          image: ghcr.io/dk10ws/ironhide-backend:dev
          ports:
            - name: http
              containerPort: 2345
          envFrom:
            - configMapRef:
                name: ironhide-backend-config
          env:
            - name: GARAGE_ENDPOINT
              value: http://garage.ironhide.svc.cluster.local:3900
            - name: GARAGE_REGION
              valueFrom:
                secretKeyRef:
                  name: ironhide-garage-secrets
                  key: IRONHIDE_S3_REGION
            - name: GARAGE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: ironhide-garage-secrets
                  key: GARAGE_DEFAULT_BUCKET
            - name: GARAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ironhide-garage-secrets
                  key: GARAGE_DEFAULT_ACCESS_KEY
            - name: GARAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ironhide-garage-secrets
                  key: GARAGE_DEFAULT_SECRET_KEY
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ironhide-backend-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ironhide-backend-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ironhide-backend-secrets
                  key: POSTGRES_DB
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ironhide-backend-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ironhide-backend-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: ironhide-backend-secrets
                  key: GOOGLE_REDIRECT_URI
          livenessProbe:
            httpGet:
              path: /api/health
              port: 2345
              httpHeaders:
                - name: Host
                  value: localhost:2345
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 2345
              httpHeaders:
                - name: Host
                  value: localhost:2345
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
