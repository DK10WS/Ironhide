apiVersion: v1
kind: ConfigMap
metadata:
  name: ironhide-backend-config
  labels:
    app.kubernetes.io/name: ironhide
    app.kubernetes.io/component: backend
data:
  ADDR: ":2345"

  CONTROL_HOST: localhost:2345
  PUBLIC_URL: http://localhost:2345
  DATA_HOST_SUFFIX: .preview.localhost:2345
  DATA_SCHEME: http
  FRONTEND_ORIGIN: http://localhost:7210

  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_SSLMODE: disable

  SESSION_COOKIE_SECURE: "false"
  QUOTA_BYTES_PER_USER: "1073741824"

  MAX_TOTAL_BYTES: "52428800"
  MAX_ARCHIVE_BYTES: "52428800"
  MAX_FILE_BYTES: "52428800"
  MAX_UPLOAD_BYTES: "268435456"
  MAX_ENTRIES: "4096"

  UPLOAD_TTL_SECONDS: "3600"
  SWEEP_INTERVAL_SECONDS: "300"
  PURGE_INTERVAL_SECONDS: "60"
  RECONCILE_INTERVAL_SECONDS: "900"
  SESSION_LIFETIME_SECONDS: "2592000"
