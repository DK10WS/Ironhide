info:
  name: Readiness
  type: http
  seq: 2

http:
  method: GET
  url: "{{BaseUrl}}/health/ready"
  auth:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Readiness probe. Checks that Postgres and Garage are both reachable.

  Unauthenticated for the same reason as /health.

  Use this one to gate traffic; use /health only to decide whether the
  process is alive.