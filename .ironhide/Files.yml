info:
  name: Upload multiple files
  type: http
  seq: 5

http:
  method: POST
  url: "{{BaseUrl}}/upload/files"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - /home/DK10/Downloads/personal-blog-website-main/index.html
      - name: file
        type: file
        value:
          - /home/DK10/Downloads/personal-blog-website-main/assets/css/style.css
      - name: file
        type: text
        value: ""
  auth:
    type: bearer
    token: "{{UploadToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Uploads several files that land under one shared prefix.

  Filenames are used exactly as sent, including any directory part, so
  "./site/assets/app.js" becomes assets/app.js on the served site. That is
  what keeps relative URLs in the page working.

  Requires the bearer credential.
