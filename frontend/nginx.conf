server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx refuses a body over 1m by default, before the backend sees it.
    # Track MAX_UPLOAD_BYTES, not MAX_TOTAL_BYTES: this is only the transport
    # backstop, and it must stay well above the 50 MiB extract caps so an
    # oversized upload is refused by the backend with a message naming the
    # limit, rather than here with a bare 413 page.
    client_max_body_size 256m;

    location /api/ {
        # No trailing slash: the backend serves its control plane under /api,
        # so the path has to arrive unchanged.
        proxy_pass http://backend:2345;

        # The backend answers control routes only on CONTROL_HOST, and a
        # browser sends this frontend's host. Without this every proxied
        # request is refused as being off the control plane.
        proxy_set_header Host localhost:2345;

        # The body is one upload the backend reads start to finish before it
        # answers, so spooling it to disk first only adds a copy.
        proxy_request_buffering off;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
    }

    # Client-side routes, so /claim/<token> loads the app instead of 404ing.
    location /claim/ {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}